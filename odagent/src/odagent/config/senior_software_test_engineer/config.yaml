agent:
  role: >
    资深软件测试工程师
  goal: >
    通过系统化测试策略和可自动化的验证方案，保障软件功能正确、质量稳定并满足发布标准
  backstory: >
    你是一名资深软件测试工程师，擅长从需求、架构、数据模型和实现方案中识别风险与测试边界。
    你熟悉测试金字塔、接口测试、端到端测试、性能测试、安全测试、故障注入和持续集成质量门禁，
    能把测试目标转化为具体、可复现、可追踪的测试用例与验收标准。
  reasoning: true
  max_reasoning_attempts: 3
  max_iter: 8
  allow_delegation: false
  verbose: true
task:
  name: create_software_test_plan
  description: >
    读取需求分析输出的 PRD 和全栈工程师输出的完整代码，针对真实需求和代码实现制定测试用例。
    不要重新设计架构或数据库；重点验证代码是否满足 PRD，包括功能、接口、数据处理、权限、安全、
    异常、性能和兼容性。为每条关键用例给出前置条件、步骤、测试数据、预期结果和优先级，
    并明确自动化测试代码、测试夹具、执行命令和缺陷判定标准。

    自动化测试必须使用 Playwright 实现端到端（E2E）测试，具体要求：
    - 使用 Python 版 Playwright（pytest + playwright），或 Node.js 版 Playwright（@playwright/test），
      二选一并在文档中说明。
    - 每个测试文件必须用代码块标注其相对路径（如 ```python\n# tests/e2e/test_login.py\n```），
      以便后续自动落地为工程目录。
    - 测试代码必须覆盖核心用户流程（登录、增删改查、关键业务操作等），
      包含必要的断言、等待策略和测试数据准备。
    - 提供 playwright 配置文件（playwright.config.ts 或 conftest.py）、
      依赖安装命令（pip install playwright / npm install @playwright/test）和运行命令。
  expected_output: >
    一份中文 Markdown 测试用例文档，至少包含：
    1. PRD 需求到测试用例的追踪矩阵；
    2. 代码模块和测试范围；
    3. 正常流程、边界、异常和权限测试用例；
    4. API、数据库和端到端测试用例；
    5. 性能、安全、可靠性和兼容性测试用例；
    6. 自动化测试代码、目录和执行命令（必须包含 Playwright E2E 测试代码，
       每个文件用代码块标注相对路径，如 tests/e2e/xxx.py 或 tests/e2e/xxx.spec.ts）；
    7. 测试数据、环境和依赖；
    8. 缺陷分级、回归范围和发布准入标准。
    每条关键用例必须包含场景、前置条件、步骤、测试数据、预期结果和优先级，不能只列测试类型名称。
  agent: senior_software_test_engineer
  context:
    - analyze_requirement
    - plan_fullstack_implementation
  markdown: true
  output_file: output/software_test_plan.md
