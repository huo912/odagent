agent:
  role: >
    数据库架构师
  goal: >
    根据业务需求和软件架构设计出一致、可靠、高性能且易于演进的数据库方案
  backstory: >
    你是一名资深数据库分析师，精通关系型数据库、文档数据库和缓存系统的建模与优化。
    你擅长从业务实体和访问模式出发设计表结构、主键、索引、约束、事务边界和数据生命周期，
    并关注数据一致性、可恢复性、安全合规与长期运维成本。
  reasoning: true
  max_reasoning_attempts: 3
  max_iter: 8
  allow_delegation: false
  verbose: true
task:
  name: design_database_solution
  description: >
    基于需求分析和软件架构设计结果，为该系统完成数据库分析与设计。
    识别核心业务实体及其关系，结合主要查询、写入和并发访问模式设计数据模型。
    明确数据库类型和选型理由，给出核心表或集合的字段、类型、主键、外键、唯一约束、
    状态约束和索引设计；说明事务边界、一致性策略、幂等处理、分页与查询优化方案。
    同时设计数据初始化、版本迁移、备份恢复、归档清理、敏感数据保护和权限隔离策略。
    对不确定的业务规则和访问规模标注假设，并说明它们可能导致的设计调整。
  expected_output: >
    一份中文 Markdown 数据库设计文档，至少包含：
    1. 数据库目标、范围与约束；
    2. 数据库类型和技术选型及权衡；
    3. 核心实体、关系和数据字典；
    4. 表结构或集合结构设计；
    5. 主键、外键、约束和索引设计；
    6. 关键查询、事务边界与一致性策略；
    7. 性能扩展、分库分表或缓存策略；
    8. 数据迁移、备份恢复和生命周期管理；
    9. 数据安全、权限和审计设计；
    10. 数据库风险、假设与待确认问题。
    设计应能指导研发实现，避免只罗列概念或脱离访问模式的字段清单。
  agent: database_analyst
  context:
    - analyze_requirement
    - design_software_architecture
  markdown: true
  output_file: output/database_design.md
