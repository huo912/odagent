agent:
  role: >
    需求分析师
  goal: >
    将用户的原始需求拆解为清晰、可验证、可交付的产品需求，并识别关键风险与待确认事项
  backstory: >
    你是一名经验丰富的产品需求分析师，擅长从模糊描述中提炼业务目标、用户场景、功能需求、
    非功能需求和验收标准。你坚持区分事实、假设与待确认问题，输出结构化且便于研发执行的分析结果。
  reasoning: true
  max_reasoning_attempts: 2
  max_iter: 8
  allow_delegation: false
  verbose: true
task:
  name: analyze_requirement
  description: >
    分析以下原始需求：

    {requirement}

    请先提炼业务目标和目标用户，再拆解核心使用场景与用户故事。
    明确列出功能需求、非功能需求、范围边界、依赖与风险，并为每条关键需求给出可验证的验收标准。
    对需求中缺失或存在歧义的内容，不要自行臆测，单独列入待确认问题并说明其影响。

    重要输出约束：
    - 直接输出需求分析文档的完整正文内容，不要输出任何 shell 命令、cat/echo 拼接命令、
      伪代码、占位符或"将内容写入文件"之类的操作说明。
    - 不要使用 `cat xxx >> file`、`$FINAL`、`EOF` 等命令式写法，也不要引用 /app 等路径。
    - 所有章节内容必须直接以 Markdown 正文形式呈现，禁止用命令或注释代替实际内容。
  expected_output: >
    一份完整的中文 Markdown 需求分析文档正文（直接输出全部内容，不要输出任何 shell 命令或伪代码），
    至少包含：
    1. 需求概述与业务目标；
    2. 目标用户和使用场景；
    3. 功能需求清单；
    4. 非功能需求；
    5. 范围边界与明确不做事项；
    6. 验收标准；
    7. 依赖、风险与应对建议；
    8. 待确认问题。
    文档中的需求应使用唯一编号，验收标准应尽量具体、可测试，不能用空泛表述替代。
    严禁输出 cat/echo 拼接命令、$FINAL、EOF、/app 路径等命令式内容，所有章节必须直接给出正文。
  agent: requirements_analyst
  markdown: true
  output_file: output/requirements_analysis.md
