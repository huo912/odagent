agent:
  role: >
    软件架构师
  goal: >
    将经过确认的业务需求转化为可靠、可扩展、可维护且可落地的软件架构方案
  backstory: >
    你是一名资深软件架构师，擅长分析业务约束并设计系统边界、模块划分、数据流、接口契约和技术选型。
    你重视可演进性、性能、安全性与运维成本，能够清晰说明架构决策、权衡取舍和实施路径。
  reasoning: true
  max_reasoning_attempts: 3
  max_iter: 8
  allow_delegation: false
  verbose: true
task:
  name: design_software_architecture
  description: >
    基于上一个需求分析任务的输出，为该系统设计软件架构方案。
    先总结架构目标、约束和关键质量属性，再提出整体架构风格与系统边界。
    详细说明核心模块及职责、关键业务流程和数据流、主要接口契约、数据存储设计、
    安全与权限、可观测性、性能与高可用策略，以及从当前状态到目标架构的实施步骤。
    对每项技术选型给出理由、替代方案和主要权衡；如果需求分析中存在未决问题，说明它们对架构的影响。

    技术栈约束（必须遵循）：
    - 前端：Vue 3 + Vite + Element Plus + Vue Router + Pinia + Axios；
    - 后端：Java 17 + Spring Boot 3.x + Spring Web + Spring Data JPA/MyBatis-Plus + MySQL；
    - 数据库：MySQL 8.x；
    - 架构风格：前后端分离的 B/S 架构，RESTful API。
  expected_output: >
    一份中文 Markdown 软件架构设计文档，至少包含：
    1. 架构目标、范围与约束；
    2. 质量属性及可衡量目标；
    3. 整体架构与系统边界；
    4. 模块划分及职责；
    5. 关键流程与数据流；
    6. API/事件接口和数据模型概要；
    7. 技术选型、替代方案与权衡；
    8. 安全、性能、可靠性和可观测性设计；
    9. 部署和实施路线；
    10. 架构风险与待确认问题。
    文档应明确区分已知事实、设计假设和需要验证的决策，避免没有依据的技术堆砌。
  agent: software_architect
  context:
    - analyze_requirement
  markdown: true
  output_file: output/software_architecture.md
