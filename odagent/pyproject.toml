[project]
name = "odagent"
version = "0.1.0"
description = "OmniDev Agent team"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.20,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "mlflow>=2.14.0",
]

[project.scripts]
odagent = "odagent.main:run"
odagent-server = "odagent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odagent"]
